<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk - Reportar incidente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📝 Reportar incidente</h1>
    </header>

    <nav>
        <a href="index.html">Inicio</a> |
        <a href="reportar.html">Reportar</a> |
        <a href="tickets.html">Tickets</a>
    </nav>

    <main>
        <section>
            <h2>Formulario de incidente</h2>
            <form action="#" method="post">
                <label for="titulo">Título del incidente:</label><br>
                <input type="text" class="input" id="titulo" name="titulo" placeholder="Escribe el título" required><br><br>

                <label for="categoria">Categoría:</label><br>
                <select class="select" id="categoria" name="categoria">
                    <option value="red">Red</option>
                    <option value="hardware">Hardware</option>
                    <option value="software">Software</option>
                </select><br><br>

                <label>Prioridad:</label><br>
                <input type="radio" id="alta" name="prioridad" value="alta"> <label for="alta">Alta</label><br>
                <input type="radio" id="media" name="prioridad" value="media"> <label for="media">Media</label><br>
                <input type="radio" id="baja" name="prioridad" value="baja"> <label for="baja">Baja</label><br><br>

                <label for="descripcion">Descripción detallada:</label><br>
                <textarea class="input" id="descripcion" name="descripcion" rows="5" cols="40" placeholder="Describe el incidente"></textarea><br><br>

                <button type="submit" class="btn btn-primary">Enviar incidente</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 - Sistema Help Desk | Universidad Técnica de Manabí</p>
    </footer>
</body>
</html>
