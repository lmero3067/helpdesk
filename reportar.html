<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk - Reportar incidente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📝 Reportar incidente</h1>
    </header>

    <nav>
        <a href="index.html">Inicio</a> |
        <a href="reportar.html">Reportar</a> |
        <a href="tickets.html">Tickets</a>
    </nav>

    <main>
        <section>
            <h2>Formulario de incidente</h2>
            <form>
                <label>Título:</label><br>
                <input type="text" class="input" name="titulo" placeholder="Escribe el título"><br><br>

                <label>Categoría:</label><br>
                <select class="select" name="categoria">
                    <option>Red</option>
                    <option>Hardware</option>
                    <option>Software</option>
                </select><br><br>

                <label>Prioridad:</label><br>
                <input type="radio" name="prioridad" value="alta"> Alta<br>
                <input type="radio" name="prioridad" value="media"> Media<br>
                <input type="radio" name="prioridad" value="baja"> Baja<br><br>

                <label>Descripción:</label><br>
                <textarea class="input" rows="4" cols="40" placeholder="Describe el incidente"></textarea><br><br>

                <input type="submit" class="btn btn-primary" value="Enviar">
            </form>
        </section>
    </main>

    <footer>
        <p>Universidad Técnica de Manabí - 2026</p>
    </footer>
</body>
</html>
