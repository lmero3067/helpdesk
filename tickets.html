<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk - Tickets</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📋 Listado de tickets</h1>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="reportar.html">Reportar</a>
        <a href="tickets.html">Tickets</a>
    </nav>

    <main>
        <section>
            <h2>Tickets registrados</h2>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Categoría</th>
                        <th>Prioridad</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Servidor caído</td>
                        <td>Red</td>
                        <td><span class="badge badge-alta">Alta</span></td>
                        <td>Abierto</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Teclado no funciona</td>
                        <td>Hardware</td>
                        <td><span class="badge badge-media">Media</span></td>
                        <td>En progreso</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Error en aplicación</td>
                        <td>Software</td>
                        <td><span class="badge badge-baja">Baja</span></td>
                        <td>Resuelto</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>© 2026 - Sistema Help Desk | Universidad Técnica de Manabí</p>
    </footer>
</body>
</html>
