<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Kit - Help Desk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎨 UI Kit - Sistema Help Desk</h1>
        <p>Librería de componentes reutilizables</p>
    </header>

    <main>
        <!-- Sección Botones -->
        <section>
            <h2>Botones</h2>
            <button class="btn btn-primary">Primario</button>
            <button class="btn btn-secondary">Secundario</button>
            <button class="btn btn-danger">Peligro</button>
        </section>

        <!-- Sección Formularios -->
        <section>
            <h2>Formularios</h2>
            <input type="text" class="input" placeholder="Texto">
            <select class="select">
                <option>Red</option>
                <option>Hardware</option>
                <option>Software</option>
            </select>
        </section>

        <!-- Sección Tarjetas -->
        <section>
            <h2>Tarjetas (Cards)</h2>
            <div class="card">
                <h3>Ticket #001</h3>
                <p>Servidor caído en sala 2</p>
            </div>
        </section>

        <!-- Sección Alertas -->
        <section>
            <h2>Alertas (Badges)</h2>
            <span class="badge badge-alta">Alta</span>
            <span class="badge badge-media">Media</span>
            <span class="badge badge-baja">Baja</span>
        </section>
    </main>

    <footer>
        <p>Universidad Técnica de Manabí - 2026</p>
    </footer>
</body>
</html>
